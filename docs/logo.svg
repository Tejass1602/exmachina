<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd93d;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circuit pattern -->
  <g opacity="0.05">
    <pattern id="circuit" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#00d4aa"/>
      <path d="M0,20 L40,20 M20,0 L20,40" stroke="#000" stroke-width="1" fill="none"/>
      <circle cx="20" cy="20" r="3" fill="#000"/>
    </pattern>
    <rect width="400" height="200" fill="url(#circuit)"/>
  </g>
  
  <!-- Main text -->
  <text x="200" y="115" font-family="Orbitron, Rajdhani, sans-serif" font-size="72" font-weight="900" 
        fill="url(#grad1)" text-anchor="middle" filter="url(#glow)">
    ExMachina
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="150" font-family="Rajdhani, sans-serif" font-size="18" font-weight="500" 
        fill="#888" text-anchor="middle" letter-spacing="4">
    SPLIT-EDGE WORKBENCH COPILOT
  </text>
  
  <!-- Decorative elements -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="url(#grad2)" opacity="0.3"/>
    <path d="M15,30 L30,45 L45,15" stroke="#ff6b6b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <g transform="translate(260, 50)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="url(#grad1)" opacity="0.3"/>
    <circle cx="30" cy="30" r="18" stroke="#00d4aa" stroke-width="3" fill="none"/>
    <circle cx="30" cy="30" r="8" fill="#00d4aa"/>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="100" y1="175" x2="300" y2="175" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round"/>
</svg>