# ExMachina Smart Bench Probe Firmware Configuration
# Target: Raspberry Pi Pico 2 W (RP2350A, Cortex-M33)

# USB CDC-ACM
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_VID=0x2E8A
CONFIG_USB_DEVICE_PID=0x000A
CONFIG_USB_DEVICE_MANUFACTURER="ExMachina"
CONFIG_USB_DEVICE_PRODUCT="Smart Bench Probe"
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_CLASS=y

# I2C
CONFIG_I2C=y
CONFIG_I2C_0=y
CONFIG_I2C_0_DEFAULT_CFG=0x02

# ADC
CONFIG_ADC=y
CONFIG_ADC_RP2040=y

# GPIO
CONFIG_GPIO=y
CONFIG_GPIO_RP2040=y

# System
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=150000000

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_PRINTK=y

# Shell (for debugging)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Workqueue for async operations
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Minimal footprint
CONFIG_TICKLESS_KERNEL=y